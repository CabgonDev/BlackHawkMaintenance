[versions]
agp = "9.4.1"
coreSplashscreen = "1.2.0"
firebaseBom = "34.19.0"

junit = "4.13.2"
kotlin = "2.4.20"
ksp = "2.3.12"
lightcompressor = "1.3.3"
localbroadcastmanager = "1.1.0"
lottie = "6.7.1"
material = "1.14.0"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
media3Exoplayer = "1.11.1"
media3Ui = "1.11.1"
recyclerview = "1.4.0"
coreKtx = "1.19.1"
fragmentKtx = "1.9.1"
androidxPdfViewer = "1.0.0-beta01"
room = "2.8.5"
sqliteAndroid = "3.49.0"

mlkitTranslate = "17.0.3"
retrofit = "3.0.0"
okhttp = "5.5.0"
moshi = "1.15.2"

jsoup = "1.23.2"
swiperefreshlayout = "1.2.0"
volley = "1.2.1"
activity = "1.13.0"
biometric = "1.1.0"
firebaseFirestoreKtx = "26.1.2"

[libraries]
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth-ktx = { module = "com.google.firebase:firebase-auth" }
firebase-firestore-ktx = { module = "com.google.firebase:firebase-firestore" }
firebase-storage-ktx = { module = "com.google.firebase:firebase-storage" }
firebase-remoteconfig-ktx = { module = "com.google.firebase:firebase-config" }
firebase-functions-ktx = { module = "com.google.firebase:firebase-functions" }

junit = { module = "junit:junit", version.ref = "junit" }
lightcompressor = { module = "com.github.AbedElazizShe:LightCompressor", version.ref = "lightcompressor" }
localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
material = { module = "com.google.android.material:material", version.ref = "material" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Ui" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
fragmentKtx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }

androidxPdfViewerFragment = { module = "androidx.pdf:pdf-viewer-fragment", version.ref = "androidxPdfViewer" }
sqliteAndroid = { module = "com.github.requery:sqlite-android", version.ref = "sqliteAndroid" }

mlkitTranslate = { module = "com.google.mlkit:translate", version.ref = "mlkitTranslate" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofitMoshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
moshiKotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
moshi-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
retrofitScalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofit" }

jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
google-firebase-firestore-ktx = { group = "com.google.firebase", name = "firebase-firestore-ktx", version.ref = "firebaseFirestoreKtx" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp            = { id = "com.google.devtools.ksp",       version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
